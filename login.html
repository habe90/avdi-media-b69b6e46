<!DOCTYPE html>
<html lang="ba">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prijava | Avdić Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--light-bg); padding:24px; }
  .auth-card { background:var(--white); padding:40px 36px; border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:440px; }
  .auth-card h2 { font-size:24px; margin-bottom:8px; }
  .auth-card .sub { color:var(--gray); margin-bottom:28px; font-size:14px; }
  .auth-card .field { margin-bottom:18px; }
  .auth-card label { display:block; margin-bottom:6px; font-weight:500; font-size:14px; }
  .auth-card input { width:100%; padding:12px 14px; border:1px solid rgba(0,0,0,.12); border-radius:10px; font-family:inherit; font-size:14px; }
  .auth-card input:focus { outline:none; border-color:var(--green); }
  .auth-card .btn { width:100%; text-align:center; margin-top:8px; }
  .auth-card .alt { text-align:center; margin-top:18px; font-size:14px; color:var(--gray); }
  .auth-card .alt a { color:var(--green); font-weight:600; }
  .auth-msg { text-align:center; font-size:14px; min-height:20px; margin-bottom:8px; }
  .auth-msg.error { color:#e74c3c; }
  .auth-msg.success { color:var(--green); }
  .logo-link { display:block; text-align:center; margin-bottom:24px; }
  .logo-link .logo { font-weight:800; font-size:22px; color:var(--dark); }
  .logo-link .logo span { color:var(--green); }
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="/" class="logo-link"><span class="logo">Avdić<span>Media</span></span></a>
    <h2>Prijava</h2>
    <p class="sub">Unesite svoje podatke za pristup CMS-u</p>
    <div class="auth-msg" id="msg"></div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="vas@email.com"></div>
    <div class="field"><label>Lozinka</label><input type="password" id="password" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="loginBtn">Prijavi se</button>
    <p class="alt">Nemate nalog? <a href="/register.html">Registrujte se</a></p>
  </div>
</div>
<script type="module" src="src/login.js"></script>
</body>
</html>
