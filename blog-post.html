<!DOCTYPE html>
<html lang="ba">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Članak | Avdić Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .post-page{padding:140px 0 100px;min-height:100vh;}
  .post-container{max-width:780px;margin:0 auto;}
  .post-container h1{font-size:clamp(24px,4vw,34px);margin-bottom:12px;color:var(--dark);}
  .post-meta{color:var(--gray);font-size:14px;margin-bottom:32px;display:flex;gap:16px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid rgba(0,0,0,.08);}
  .post-meta span{color:var(--green);font-weight:600;}
  .post-content{font-size:16px;line-height:1.9;color:var(--dark-2);}
  .post-content p{margin-bottom:18px;}
  .post-content h2,.post-content h3{margin:32px 0 14px;color:var(--dark);}
  .back-link{display:inline-block;margin-bottom:28px;color:var(--green);font-weight:600;font-size:14px;text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
  .post-featured-img{margin-bottom:28px;border-radius:14px;overflow:hidden;}
  .post-featured-img img{width:100%;display:block;border-radius:14px;}
  .post-error{text-align:center;padding:80px 0;color:var(--gray);}
</style>
</head>
<body>

<header class="header" id="header">
  <div class="container header-inner">
    <a href="/" class="logo">Avdić<span>Media</span></a>
    <nav class="nav" id="nav">
      <a href="/">Početna</a>
      <a href="/#usluge">Usluge</a>
      <a href="/#onama">O nama</a>
      <a href="/#portfolio">Proces</a>
      <a href="/blog.html" style="color:var(--green);font-weight:600;">Blog</a>
      <a href="/#kontakt">Kontakt</a>
    </nav>
    <div style="display:flex;gap:12px;align-items:center;">
      <a href="/login.html" class="btn btn-primary nav-cta">CMS Prijava</a>
      <button class="burger" id="burger" aria-label="Meni">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<section class="post-page">
  <div class="container post-container">
    <a href="/blog.html" class="back-link">← Nazad na blog</a>
    <div id="postContent"></div>
    <div id="postError" class="post-error" style="display:none">
      <p style="font-size:18px;">Članak nije pronađen.</p>
      <a href="/blog.html" class="btn btn-primary" style="margin-top:16px;display:inline-block;text-decoration:none;">Pregledaj blog</a>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-inner">
    <a href="/" class="logo">Avdić<span>Media</span></a>
    <p>&copy; <span id="year"></span> Avdić Media. Sva prava zadržana.</p>
  </div>
</footer>

<script>
  document.getElementById('burger').addEventListener('click',()=>{document.getElementById('nav').classList.toggle('open')});
  document.querySelectorAll('.nav a').forEach(l=>l.addEventListener('click',()=>document.getElementById('nav').classList.remove('open')));
  document.getElementById('year').textContent=new Date().getFullYear();
</script>
<script type="module" src="src/blog-post.js"></script>
</body>
</html>
